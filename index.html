<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ISECheckIN - Employee Attendance</title>

  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body { -webkit-font-smoothing: antialiased; }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  </style>
  <link rel="stylesheet" href="./assets/app.css" />
</head>

<body class="bg-slate-100 text-slate-800">
  <div id="root">
    <div style="font-family: Arial, sans-serif; padding: 24px; color: #334155;">
      Loading ISE Check-in...
    </div>
  </div>

  <script>
    function escapeAppErrorText(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showAppError(title, detail) {
      var root = document.getElementById("root");
      if (!root) return;

      var errorRef = "WEB-" + Date.now().toString(36).toUpperCase();

      root.innerHTML =
        '<div style="font-family: Arial, sans-serif; min-height: 100vh; padding: 24px; background: #f8fafc; color: #7f1d1d;">' +
          '<div style="max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #fecaca; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);">' +
            '<h1 style="font-size: 20px; margin: 0 0 8px; color: #991b1b;">' + escapeAppErrorText(title) + '</h1>' +
            '<p style="font-size: 14px; line-height: 1.5; white-space: pre-wrap; color: #334155;">' + escapeAppErrorText(detail || "Unknown error") + '</p>' +
            '<p style="margin-top: 16px; font-size: 12px; color: #64748b;">Reference: ' + errorRef + '</p>' +
            '<button onclick="location.reload()" style="margin-top:14px;border:0;border-radius:10px;background:#991b1b;color:#fff;padding:10px 16px;font-weight:700;">Reload app</button>' +
          '</div>' +
        '</div>';
    }

    window.addEventListener("error", function (event) {
      showAppError("App failed to load", event.message || "Unknown JavaScript error");
    });

    window.addEventListener("unhandledrejection", function (event) {
      var reason = event.reason;
      var message = reason && reason.message ? reason.message : reason;
      showAppError("App error", message || "Unknown promise error");
    });
  </script>

  <script src="./assets/app.js" defer></script>
</body>
</html>
