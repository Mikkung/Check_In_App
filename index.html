  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // ===== WFA WINDOW (EDIT) =====
    const WFA_ENABLED = true;
    const WFA_START = "2026-03-14"; // yyyy-MM-dd
    const WFA_END   = "2026-03-31"; // yyyy-MM-dd

    // ===================== EDIT HERE =====================
    const API_URL = "https://script.google.com/macros/s/AKfycbw9nuvzaB_O3xHQq1HEmg7ZukBgbqgSG2bN8lv8AXM7_Yc63sZXiwaNXjnK4UIQSrCKRw/exec";
    // =====================================================

    const ROOMS = [
      "ISE Meeting Room 1 (1st Fl.)",
      "ISE Meeting Room 2 (2nd Fl.)",
      "ISE Meeting Room 3 (Interhub)",
    ];

    // --- Icons ---
    const Icon = ({ path, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {path}
      </svg>
    );

    const Icons = {
      MapPin: (p) => <Icon {...p} path={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>} />,
      CheckCircle: (p) => <Icon {...p} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
      AlertTriangle: (p) => <Icon {...p} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
      Navigation: (p) => <Icon {...p} path={<><polygon points="3 11 22 2 13 21 11 13 3 11"/></>} />,
      LogOut: (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />,
      LogIn: (p) => <Icon {...p} path={<><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></>} />,
      UserPlus: (p) => <Icon {...p} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></>} />,
      BarChart: (p) => <Icon {...p} path={<><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></>} />,
      CalendarDays: (p) => <Icon {...p} path={<><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></>} />,
      DoorOpen: (p) => <Icon {...p} path={<><path d="M14 4v16"/><path d="M4 4h10"/><path d="M4 20h10"/><path d="M4 4v16"/><path d="M14 12h6"/></>} />,
      XCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></>} />,
    };

    // --- Utils ---
    const calculateDistance = (lat1, lon1, lat2, lon2) => {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    };

    const pad2 = (n) => String(n).padStart(2, "0");
    const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const isWfaActive = (ymd) => WFA_ENABLED && (ymd >= WFA_START && ymd <= WFA_END);
    const formatClock = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const timeToMinutes = (hhmm) => {
      const m = String(hhmm || "").match(/^(\d{2}):(\d{2})$/);
      if (!m) return null;
      return Number(m[1]) * 60 + Number(m[2]);
    };
    const normalizeHHMM = (value) => {
      if (value == null || value === "") return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return `${pad2(value.getHours())}:${pad2(value.getMinutes())}`;
      }
      if (typeof value === "number" && value >= 0 && value < 1) {
        const totalMinutes = Math.round(value * 24 * 60) % (24 * 60);
        return `${pad2(Math.floor(totalMinutes / 60))}:${pad2(totalMinutes % 60)}`;
      }
      const s = String(value).trim();
      let m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
      if (m) return `${pad2(Number(m[1]))}:${m[2]}`;

      const asNumber = Number(s);
      if (!Number.isNaN(asNumber) && asNumber >= 0 && asNumber < 1) {
        const totalMinutes = Math.round(asNumber * 24 * 60) % (24 * 60);
        return `${pad2(Math.floor(totalMinutes / 60))}:${pad2(totalMinutes % 60)}`;
      }

      const d = new Date(s);
      if (!Number.isNaN(d.getTime())) {
        return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      }
      return s;
    };
    const formatTimeLabel = (value) => normalizeHHMM(value) || "-";
    const formatMinutesAsDuration = (mins) => {
      if (!Number.isFinite(mins) || mins <= 0) return "0h";
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h && m) return `${h}h ${m}m`;
      if (h) return `${h}h`;
      return `${m}m`;
    };
    const buildPhotoSrc = (photoBase64, photoMime = "") => {
      const value = String(photoBase64 || "").trim();
      if (!value) return "";
      if (value.startsWith("data:image/")) return value;
      return `data:${photoMime || "image/jpeg"};base64,${value}`;
    };
    const getInitials = (name) => {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean).slice(0, 2);
      if (!parts.length) return "?";
      return parts.map(p => p[0].toUpperCase()).join("");
    };
    const ROOM_TIMELINE_START = 8 * 60;
    const ROOM_TIMELINE_END = 20 * 60;
    const ROOM_TIMELINE_LABELS = [8, 10, 12, 14, 16, 18, 20];
    const buildTimelineBlocks = (items) => {
      const sorted = [...items]
        .map(item => ({
          ...item,
          startMin: timeToMinutes(normalizeHHMM(item.start_time)),
          endMin: timeToMinutes(normalizeHHMM(item.end_time)),
        }))
        .filter(item => item.startMin != null && item.endMin != null && item.endMin > item.startMin)
        .sort((a, b) => a.startMin - b.startMin);

      const lanes = [];
      return sorted.map(item => {
        let laneIndex = 0;
        while (lanes[laneIndex] != null && lanes[laneIndex] > item.startMin) laneIndex += 1;
        lanes[laneIndex] = item.endMin;
        return { ...item, laneIndex };
      });
    };

    const RoomTimeline = ({ items }) => {
      const blocks = buildTimelineBlocks(items);
      const laneCount = Math.max(1, ...blocks.map(b => b.laneIndex + 1), 1);
      const totalRange = ROOM_TIMELINE_END - ROOM_TIMELINE_START;

      return (
        <div className="mt-3">
          <div className="relative rounded-xl border border-slate-200 bg-slate-50 overflow-hidden">
            <div className="absolute inset-0 flex">
              {Array.from({ length: 12 }).map((_, idx) => (
                <div key={idx} className={`flex-1 border-r ${idx === 11 ? "border-r-0" : "border-slate-200"}`} />
              ))}
            </div>

            <div className="relative" style={{ height: `${Math.max(56, 18 + laneCount * 26)}px` }}>
              {blocks.map(block => {
                const clampedStart = Math.max(block.startMin, ROOM_TIMELINE_START);
                const clampedEnd = Math.min(block.endMin, ROOM_TIMELINE_END);
                const left = ((clampedStart - ROOM_TIMELINE_START) / totalRange) * 100;
                const width = Math.max(8, ((clampedEnd - clampedStart) / totalRange) * 100);
                return (
                  <div
                    key={block.booking_id}
                    className="absolute rounded-lg bg-amber-500/90 text-white shadow-sm border border-amber-600 px-2 py-1 overflow-hidden"
                    style={{
                      left: `${left}%`,
                      width: `${width}%`,
                      top: `${10 + block.laneIndex * 26}px`,
                      minHeight: "22px",
                    }}
                    title={`${formatTimeLabel(block.start_time)} - ${formatTimeLabel(block.end_time)} | ${block.purpose}`}
                  >
                    <div className="text-[10px] font-bold whitespace-nowrap">
                      {formatTimeLabel(block.start_time)} - {formatTimeLabel(block.end_time)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="grid grid-cols-7 text-[10px] text-slate-500 mt-2 px-1">
            {ROOM_TIMELINE_LABELS.map(hour => (
              <div key={hour} className={hour === ROOM_TIMELINE_LABELS[ROOM_TIMELINE_LABELS.length - 1] ? "text-right" : "text-left"}>
                {`${pad2(hour)}:00`}
              </div>
            ))}
          </div>
        </div>
      );
    };

    function getDeviceId() {
      let id = localStorage.getItem("geocheck_device_id");
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random());
        localStorage.setItem("geocheck_device_id", id);
      }
      return id;
    }

    async function apiPost(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow",
      });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { return { ok:false, error:"Invalid JSON from server", raw:text }; }
    }

    // --- UI Components ---
    const Button = ({ children, onClick, variant='primary', disabled=false, className='' }) => {
      const base = "w-full flex items-center justify-center px-4 py-3 rounded-lg font-semibold transition active:scale-[0.99] disabled:opacity-50 disabled:pointer-events-none";
      const variants = {
        primary: "bg-blue-600 text-white hover:bg-blue-700",
        success: "bg-emerald-600 text-white hover:bg-emerald-700",
        danger: "bg-red-600 text-white hover:bg-red-700",
        ghost: "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50",
      };
      return <button className={`${base} ${variants[variant]} ${className}`} onClick={onClick} disabled={disabled}>{children}</button>;
    };

    const Card = ({ children, className='' }) => (
      <div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>{children}</div>
    );

    const Input = ({ label, type="text", value, onChange, placeholder, min }) => (
      <div className="mb-4">
        <label className="block text-sm font-medium text-slate-700 mb-1">{label}</label>
        <input
          type={type}
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          min={min}
          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    );

    const ProgressBar = ({ current, max, label }) => {
      const pct = Math.min(100, Math.max(0, (max ? (current/max)*100 : 0)));
      const danger = current > max;
      return (
        <div className="mb-4">
          <div className="flex justify-between text-xs mb-1 font-medium text-slate-600">
            <span>{label}</span>
            <span>{current} / {max}</span>
          </div>
          <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
            <div className={`h-2.5 rounded-full transition-all duration-500 ${danger ? "bg-red-500" : "bg-indigo-500"}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    };

    const Avatar = ({ user, size = 44, className = "" }) => {
      const [broken, setBroken] = useState(false);
      const src = !broken ? buildPhotoSrc(user?.photo_base64, user?.photo_mime) : "";
      const initials = getInitials(user?.name);
      if (src) {
        return (
          <img
            src={src}
            alt={user?.name || "Profile"}
            onError={() => setBroken(true)}
            className={`rounded-full object-cover border border-slate-200 bg-white ${className}`}
            style={{ width: `${size}px`, height: `${size}px` }}
          />
        );
      }
      return (
        <div
          className={`rounded-full bg-slate-800 text-white font-bold flex items-center justify-center border border-slate-200 ${className}`}
          style={{ width: `${size}px`, height: `${size}px`, fontSize: `${Math.max(14, size * 0.33)}px` }}
        >
          {initials}
        </div>
      );
    };

    const isDateInRange = (dateStr, startDate, endDate) => {
      if (!dateStr || !startDate || !endDate) return false;
      return dateStr >= startDate && dateStr <= endDate;
    };

    const isWeekendDateStr = (dateStr) => {
      if (!dateStr) return false;
      const d = new Date(`${dateStr}T00:00:00`);
      const day = d.getDay();
      return day === 0 || day === 6;
    };

    const countBusinessDaysPreview = (startDate, endDate) => {
      if (!startDate || !endDate || endDate < startDate) return 0;
      let count = 0;
      let cursor = new Date(`${startDate}T00:00:00`);
      const end = new Date(`${endDate}T00:00:00`);
      while (cursor <= end) {
        const day = cursor.getDay();
        if (day !== 0 && day !== 6) count += 1;
        cursor.setDate(cursor.getDate() + 1);
      }
      return count;
    };

    const formatDurationTypeLabel = (value) => {
      const map = {
        FULL_DAY: "Full Day",
        AM: "Morning (AM)",
        PM: "Afternoon (PM)",
        MULTI_DAY: "Multiple Days",
      };
      return map[value] || value || "-";
    };

    const getAllowedDurationOptions = (leaveType) => {
      const allowHalfDay = String(leaveType?.allow_half_day || "").toUpperCase() === "TRUE";
      return allowHalfDay
        ? ["FULL_DAY", "AM", "PM", "MULTI_DAY"]
        : ["FULL_DAY", "MULTI_DAY"];
    };

    const doesLeaveCoverDate = (item, dateStr) => {
      if (!item || String(item.record_status || "").toUpperCase() !== "ACTIVE") return false;
      const startDate = item.start_date;
      const endDate = item.end_date || item.start_date;
      return isDateInRange(dateStr, startDate, endDate);
    };

    const getLeavePreviewDays = (form) => {
      if (!form?.start_date || !form?.end_date) return 0;
      if (form.duration_type === "AM" || form.duration_type === "PM") return 0.5;
      if (form.duration_type === "FULL_DAY") return 1;
      if (form.duration_type === "MULTI_DAY") return countBusinessDaysPreview(form.start_date, form.end_date);
      return 0;
    };

    function App() {
      const [loading, setLoading] = useState(false);
      const [busyCount, setBusyCount] = useState(0);
      const [busyText, setBusyText] = useState("Loading...");
      const [toast, setToast] = useState(null);

      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState("login");
      const [authForm, setAuthForm] = useState({ name:"", email:"", password:"" });
      const [lateReason, setLateReason] = useState("");
      const [activeTab, setActiveTab] = useState("attendance");

            const [myLeaves, setMyLeaves] = useState([]);
      const [leaveTypes, setLeaveTypes] = useState([]);
      const [leaveForm, setLeaveForm] = useState({
        leave_type_code: "",
        duration_type: "FULL_DAY",
        start_date: dateKey(new Date()),
        end_date: dateKey(new Date()),
        reason: "",
        attachment_url: "",
        handover_note: "",
      });

      const [roomDate, setRoomDate] = useState(dateKey(new Date()));
      const [roomBookings, setRoomBookings] = useState([]);
      const [roomForm, setRoomForm] = useState({
        room_name: ROOMS[0],
        book_date: dateKey(new Date()),
        start_time: "09:00",
        end_time: "10:00",
        purpose: "",
        note: "",
      });

      const [config] = useState({
        startTime: "08:32",
        maxLateCount: 5,
        maxLateMinutes: 180,
        locations: [
          { name: "ISE_Headquarters", lat: 13.73656068, lng: 100.5333925, radius: 50 },
          { name: "Eng Bldg 1",       lat: 13.736649190639286, lng: 100.53261809104578, radius: 30 },
          { name: "ChulaPat_14",      lat: 13.74406954, lng: 100.525551,  radius: 50 },
        ],
      });

      const [locationStatus, setLocationStatus] = useState({
        coords: null, matchedLocation: null, distance: null, error: null, loading: false
      });

      const [logs, setLogs] = useState([]);
      const [clock, setClock] = useState(new Date());
      
      // constate สำหรับ Animation Loading
      const [bootLoading, setBootLoading] = useState(true);

      const notify = (msg, type="ok") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const startBusy = (message = "Loading...") => {
        setBusyText(message);
        setBusyCount(count => count + 1);
      };

      const stopBusy = () => {
        setBusyCount(count => Math.max(0, count - 1));
      };

      const runBusy = async (message, work) => {
        startBusy(message);
        try {
          return await work();
        } finally {
          stopBusy();
        }
      };

      useEffect(() => {
        let alive = true;

        try {
          const saved = localStorage.getItem("geocheck_user_v1");
          if (saved) {
            try {
              const parsedUser = JSON.parse(saved);
              if (alive) setCurrentUser(parsedUser);
            } catch {}
          }
        } finally {
          setTimeout(() => {
            if (alive) setBootLoading(false);
          }, 700);
        }

        return () => {
          alive = false;
        };
      }, []);

      useEffect(() => {
        if (currentUser) localStorage.setItem("geocheck_user_v1", JSON.stringify(currentUser));
        else localStorage.removeItem("geocheck_user_v1");
      }, [currentUser]);

      useEffect(() => {
        const t = setInterval(() => setClock(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      const getLocation = () => {
        if (locationStatus.loading) return;
        setLocationStatus(s => ({ ...s, loading:true, error:null }));

        if (!navigator.geolocation) {
          setLocationStatus({ loading:false, error:"Geolocation not supported", coords:null, matchedLocation:null, distance:null });
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            let closest = null;
            let minD = Infinity;

            config.locations.forEach(loc => {
              const d = calculateDistance(latitude, longitude, loc.lat, loc.lng);
              if (d < minD) { minD = d; closest = loc; }
            });

            setLocationStatus({
              loading:false,
              coords:{ lat: latitude, lng: longitude },
              matchedLocation: closest,
              distance: Math.round(minD),
              error:null
            });
          },
          (err) => {
            const msg = err.code === 1 ? "Please allow location access in browser settings." : "Unable to retrieve location";
            setLocationStatus({ loading:false, error: msg, coords:null, matchedLocation:null, distance:null });
          },
          { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
        );
      };

      useEffect(() => {
        if (currentUser && !locationStatus.coords && !locationStatus.loading) getLocation();
      }, [currentUser]);

      const refreshLogs = async (emp_id) => {
        const r = await apiPost({ action:"fetchLogs", emp_id });
        if (!r.ok) throw new Error(r.error || "fetchLogs failed");
        setLogs(r.logs || []);
      };

      const refreshLeaves = async (emp_id) => {
        const r = await apiPost({ action:"fetchMyLeaves", emp_id });
        if (!r.ok) throw new Error(r.error || "fetchMyLeaves failed");
        setMyLeaves(r.leaves || []);
      };

      const refreshLeaveTypes = async () => {
        const r = await apiPost({ action:"fetchLeaveTypes" });
        if (!r.ok) throw new Error(r.error || "fetchLeaveTypes failed");
        setLeaveTypes(r.leave_types || []);
      };

      const refreshRoomBookings = async (book_date) => {
        const r = await apiPost({ action:"fetchRoomBookings", book_date });
        if (!r.ok) throw new Error(r.error || "fetchRoomBookings failed");
        setRoomBookings((r.bookings || []).map(b => ({
          ...b,
          start_time: normalizeHHMM(b.start_time),
          end_time: normalizeHHMM(b.end_time),
        })));
      };

      useEffect(() => {
        if (!currentUser?.id) return;
        runBusy("Loading your data...", async () => {
          await Promise.allSettled([
            refreshLogs(currentUser.id),
            refreshLeaves(currentUser.id),
            refreshLeaveTypes(),
          ]);
        }).catch(err => notify(err.message, "err"));
      }, [currentUser?.id]);

      useEffect(() => {
        if (!currentUser?.id || !roomDate || activeTab !== "rooms") return;
        runBusy("Loading room availability...", async () => {
          await refreshRoomBookings(roomDate);
        }).catch(err => notify(err.message, "err"));
      }, [currentUser?.id, roomDate, activeTab]);

      const selectedLeaveType = useMemo(() => {
        return leaveTypes.find(item => item.leave_type_code === leaveForm.leave_type_code) || null;
      }, [leaveTypes, leaveForm.leave_type_code]);

      const allowedDurationOptions = useMemo(() => {
        return getAllowedDurationOptions(selectedLeaveType);
      }, [selectedLeaveType]);

      useEffect(() => {
        if (!leaveTypes.length) return;
        setLeaveForm(prev => {
          const selected = leaveTypes.find(item => item.leave_type_code === prev.leave_type_code) || leaveTypes[0];
          const allowed = getAllowedDurationOptions(selected);
          const nextDuration = allowed.includes(prev.duration_type) ? prev.duration_type : allowed[0];
          return {
            ...prev,
            leave_type_code: selected?.leave_type_code || "",
            duration_type: nextDuration,
          };
        });
      }, [leaveTypes]);

      useEffect(() => {
        setLeaveForm(prev => {
          if (prev.duration_type === "AM" || prev.duration_type === "PM" || prev.duration_type === "FULL_DAY") {
            return { ...prev, end_date: prev.start_date };
          }
          return prev;
        });

              reason = (todayActiveLeave?.reason || "AM leave - returned after 13:00").trim();

                            </div>
                            <div className="text-xs opacity-80 mt-0.5">
                              Distance: <span className="font-mono">{locationStatus.distance}m</span>
                              {" · "}
                              Nearest: <span className="font-semibold">{locationStatus.matchedLocation?.name || "Unknown"}</span>
                              {" · "}
                              Radius: <span className="font-mono">{limitUI}m</span>
                            </div>
                            <div className="text-xs mt-1 font-semibold">
                              {wfaActiveUI ? "You can check-in during WFA window." : "Check-in is blocked (WFA not active)."}
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    <Card className="p-5">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="font-bold text-slate-800 flex items-center">
                          <Icons.BarChart size={18} className="mr-2 text-indigo-600" />
                          Monthly Attendance
                        </h3>
                        <span className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">This Month</span>
                      </div>

                      <ProgressBar label="Late Occurrences" current={monthlyStats.lateCount} max={config.maxLateCount} />
                      <ProgressBar label="Late Minutes" current={monthlyStats.lateMinutes} max={config.maxLateMinutes} />

                      <div className="text-xs text-slate-400 mt-2 text-center">
                        Limits: {config.maxLateCount} times / {config.maxLateMinutes} minutes per month
                      </div>
                    </Card>

                    <Card className="p-5">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="font-bold text-slate-800 flex items-center">
                          <Icons.MapPin size={18} className="mr-2 text-blue-600" />
                          Location Check
                        </h3>
                        {locationStatus.matchedLocation && (
                          <span className="text-xs font-semibold bg-blue-50 text-blue-700 px-2 py-1 rounded">
                            {locationStatus.matchedLocation.name}
                          </span>
                        )}
                      </div>

                      {!locationStatus.coords ? (
                        <div className="text-center py-6 bg-slate-50 rounded-lg border border-dashed border-slate-300">
                          <Button onClick={getLocation} disabled={locationStatus.loading} variant="ghost">
                            <span className="inline-flex items-center gap-2">
                              <Icons.Navigation size={16} />
                              {locationStatus.loading ? "Locating..." : "Verify Location"}
                            </span>
                          </Button>
                          <p className="text-xs text-slate-400 mt-3">GPS permission required.</p>
                          {locationStatus.error && (
                            <p className="mt-3 text-red-600 text-sm flex items-center justify-center gap-2">
                              <Icons.AlertTriangle size={14} /> {locationStatus.error}
                            </p>
                          )}
                        </div>
                      ) : (
                        <div className="space-y-3">
                          <div className="flex justify-between items-center bg-slate-50 p-3 rounded-lg">
                            <span className="text-sm text-slate-500">Distance</span>
                            <span className={`font-extrabold text-lg ${locationStatus.distance > (locationStatus.matchedLocation?.radius || 10) ? "text-red-600" : "text-green-600"}`}>
                              {locationStatus.distance}m
                            </span>
                          </div>

                          {locationStatus.distance > (locationStatus.matchedLocation?.radius || 10) ? (
                            <div className={`text-xs p-2 rounded flex items-center gap-2 ${wfaActiveUI ? "text-amber-800 bg-amber-50" : "text-red-700 bg-red-50"}`}>
                              <Icons.AlertTriangle size={14} />
                              {wfaActiveUI ? "Outside radius, but WFA active (you can check-in)." : `Too far from ${locationStatus.matchedLocation?.name}. (WFA not active)`}
                            </div>
                          ) : (
                            <div className="text-xs text-green-700 bg-green-50 p-2 rounded flex items-center gap-2">
                              <Icons.CheckCircle size={14} /> Verified: {locationStatus.matchedLocation?.name}
                            </div>
                          )}

                          <button onClick={getLocation} className="text-xs text-blue-600 hover:underline w-full text-center">Refresh GPS</button>
                        </div>
                      )}
                    </Card>

                    <Card className="p-5">
                      {!status.checkedIn ? (
                        <>
                          {requireLateReason && (
                            <div className="mb-4">
                              <label className="block text-sm font-semibold text-orange-700 mb-1">
                                Late Reason <span className="text-red-500">*</span>
                              </label>
                              <textarea
                                className="w-full px-3 py-2 bg-orange-50 border border-orange-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-700 text-sm"
                                rows="2"
                                placeholder="Why are you late?"
                                value={lateReason}
                                onChange={e => setLateReason(e.target.value)}
                              />
                            </div>
                          )}

                          <Button
                            onClick={() => handleAction("IN")}
                            disabled={loading || !locationStatus.coords || isFullDayLeaveToday || status.attendanceStatus === "ABSENT"}
                            variant="primary"
                          >
                            {loading ? "Saving..." : isFullDayLeaveToday ? "ON FULL-DAY LEAVE" : status.attendanceStatus === "ABSENT" ? "ABSENT FINALIZED" : "SUBMIT CHECK-IN"}
                          </Button>
                        </>
                      ) : !status.checkedOut ? (
                        <div className="space-y-4">
                          <div className="bg-blue-50 text-blue-800 p-4 rounded-lg text-sm text-center">
                            You checked in at <strong>{status.checkInTime}</strong>.
                            <br />Ready to leave?
                          </div>
                          <Button onClick={() => handleAction("OUT")} disabled={loading || !locationStatus.coords} variant="danger">
                            {loading ? "Saving..." : "CHECK OUT"}
                          </Button>
                        </div>
                      ) : (
                        <div className="text-center py-4">
                          <div className="inline-block p-3 bg-green-100 text-green-600 rounded-full mb-3">
                            <Icons.CheckCircle size={32} />
                          </div>
                          <h3 className="text-lg font-extrabold text-slate-800">Shift Complete</h3>
                          <p className="text-slate-500 text-sm">Have a great evening!</p>
                        </div>
                      )}
                    </Card>

                    <Card className="p-5">
                      <div className="text-sm font-bold text-slate-800 mb-2">Debug</div>
                      <div className="text-xs text-slate-500 space-y-1">
                        <div>API: <span className="font-mono break-all">{API_URL}</span></div>
                        <div>WFA: {WFA_ENABLED ? "ON" : "OFF"} ({WFA_START} → {WFA_END})</div>
                        <div>Today Row: {todayRow ? "FOUND" : "NOT FOUND"}</div>
                        <div>Logs Loaded: {logs.length}</div>
                        <div>Leave Today: {todayActiveLeave ? `${todayActiveLeave.leave_type_code} / ${todayActiveLeave.duration_type}` : "NO"}</div>
                      </div>
                      <div className="mt-3 space-y-2">
                        <Button variant="ghost" onClick={() => runBusy("Refreshing logs...", async () => { await refreshLogs(currentUser.id); }).then(()=>notify("Logs refreshed")).catch(e=>notify(e.message,"err"))} disabled={loading}>
                          Refresh Logs from Sheet
                        </Button>
                        <Button variant="ghost" onClick={() => runBusy("Refreshing leave records...", async () => { await refreshLeaves(currentUser.id); }).then(()=>notify("Leaves refreshed")).catch(e=>notify(e.message,"err"))} disabled={loading}>
                          Refresh Leaves
                        </Button>
                      </div>
                    </Card>
                  </>
                )}

                                {activeTab === "leave" && (
                  <>
                    <Card className="p-5">
                      <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Icons.CalendarDays size={18} className="mr-2 text-blue-600" /> Create Leave Request</h3>

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Leave Type</label>
                        <select
                          value={leaveForm.leave_type_code}
                          onChange={e => setLeaveForm({ ...leaveForm, leave_type_code: e.target.value })}
                          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                          {leaveTypes.map(item => (
                            <option key={item.leave_type_code} value={item.leave_type_code}>{item.leave_type_name}</option>
                          ))}
                        </select>
                      </div>

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Duration Type</label>
                        <select
                          value={leaveForm.duration_type}
                          onChange={e => setLeaveForm({ ...leaveForm, duration_type: e.target.value })}
                          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                          {allowedDurationOptions.map(opt => (
                            <option key={opt} value={opt}>{formatDurationTypeLabel(opt)}</option>
                          ))}
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <Input
                          label="Start Date"
                          type="date"
                          min={dateKey(new Date())}
                          value={leaveForm.start_date}
                          onChange={e => setLeaveForm({ ...leaveForm, start_date: e.target.value })}
                        />
                        <Input
                          label="End Date"
                          type="date"
                          min={leaveForm.start_date || dateKey(new Date())}
                          value={leaveForm.end_date}
                          onChange={e => setLeaveForm({ ...leaveForm, end_date: e.target.value })}
                        />
                      </div>

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Total Days</label>
                        <input
                          type="text"
                          readOnly
                          value={leavePreviewDays}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700"
                        />
                        <div className="text-[11px] text-slate-500 mt-1">Preview excludes weekends. Final calculation on server also excludes holidays.</div>
                      </div>

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Reason</label>
                        <textarea
                          value={leaveForm.reason}
                          onChange={e => setLeaveForm({ ...leaveForm, reason: e.target.value })}
                          rows="3"
                          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="Please enter your reason"
                        />
                      </div>

                      <Input
                        label="Attachment URL (optional)"
                        value={leaveForm.attachment_url}
                        onChange={e => setLeaveForm({ ...leaveForm, attachment_url: e.target.value })}
                        placeholder="https://..."
                      />

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Handover Note</label>
                        <textarea
                          value={leaveForm.handover_note}
                          onChange={e => setLeaveForm({ ...leaveForm, handover_note: e.target.value })}
                          rows="4"
                          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="ภาระงานที่มอบหมายให้เพื่อนร่วมงาน / งานเร่งด่วนที่ต้องดูแลแทน"
                        />
                      </div>

                      <Button onClick={handleSubmitLeave} disabled={loading || !leaveTypes.length}>{loading ? "Saving..." : "Submit Leave"}</Button>
                    </Card>

                    <Card className="p-5">
                      <div className="flex items-center justify-between gap-3 mb-4">
                        <h3 className="font-bold text-slate-800">My Leave Records</h3>
                        <button
                          onClick={() => runBusy("Refreshing leave records...", async () => { await refreshLeaves(currentUser.id); }).then(()=>notify("Leave records refreshed")).catch(e=>notify(e.message,"err"))}
                          className="text-xs text-blue-600 hover:underline"
                        >
                          Refresh
                        </button>
                      </div>

                      <div className="space-y-3">
                        {myLeaves.length === 0 ? (
                          <div className="text-sm text-slate-500">No leave records</div>
                        ) : myLeaves.map(item => {
                          const active = String(item.record_status || "").toUpperCase() === "ACTIVE";
                          return (
                            <div key={item.leave_id} className="border border-slate-200 rounded-xl p-4 bg-white shadow-sm">
                              <div className="flex items-start justify-between gap-3">
                                <div className="min-w-0">
                                  <div className="font-semibold text-slate-800">{item.leave_type_name}</div>
                                  <div className="text-sm text-slate-600 mt-1">
                                    {formatDurationTypeLabel(item.duration_type)} · {item.start_date}{item.end_date && item.end_date !== item.start_date ? ` → ${item.end_date}` : ""}
                                  </div>
                                  <div className="text-xs text-slate-500 mt-1">Days: {item.total_days}</div>
                                </div>

                                <div className="flex flex-col items-end gap-1 shrink-0">
                                  <span className={`text-[11px] px-2 py-1 rounded-full font-semibold ${active ? "bg-emerald-50 text-emerald-700" : "bg-slate-100 text-slate-600"}`}>
                                    {item.record_status}
                                  </span>
                                  <span className="text-[11px] px-2 py-1 rounded-full font-semibold bg-blue-50 text-blue-700">
                                    {item.form_status}
                                  </span>
                                </div>
                              </div>

                              <div className="text-xs text-slate-600 mt-3"><span className="font-semibold">Reason:</span> {item.reason || "-"}</div>
                              <div className="text-xs text-slate-600 mt-1"><span className="font-semibold">Handover:</span> {item.handover_note || "-"}</div>
                              <div className="text-xs text-slate-500 mt-1">Requested: {item.request_date || "-"}</div>
                              {item.form_generated_at && <div className="text-xs text-slate-500 mt-1">Generated: {item.form_generated_at}</div>}
                              {item.sent_at && <div className="text-xs text-slate-500 mt-1">Sent: {item.sent_at}</div>}
                              {item.form_file_url && (
                                <div className="mt-2">
                                  <a href={item.form_file_url} target="_blank" rel="noreferrer" className="text-xs text-blue-600 hover:underline">Open generated form</a>
                                </div>
                              )}

                              <div className="mt-4 flex flex-wrap gap-2">
                                <button
                                  onClick={() => handleGenerateLeaveForm(item.leave_id)}
                                  disabled={!active || loading}
                                  className="px-3 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white disabled:opacity-50"
                                >
                                  Generate Form
                                </button>
                                <button
                                  onClick={() => handleSendLeaveToEmail(item.leave_id)}
                                  disabled={!active || loading}
                                  className="px-3 py-2 rounded-lg text-xs font-semibold bg-emerald-600 text-white disabled:opacity-50"
                                >
                                  Send to Email
                                </button>
                                <button
                                  onClick={() => handleCancelLeave(item.leave_id)}
                                  disabled={!active || loading}
                                  className="px-3 py-2 rounded-lg text-xs font-semibold bg-red-50 text-red-700 border border-red-200 disabled:opacity-50"
                                >
                                  Cancel Leave
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </Card>
                  </>
                )}

                {activeTab === "rooms" && (
                  <>
                    <Card className="p-5">
                      <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Icons.DoorOpen size={18} className="mr-2 text-blue-600" /> Check Room Availability</h3>

                      <Input
                        label="Date"
                        type="date"
                        min={dateKey(new Date())}
                        value={roomDate}
                        onChange={e => {
                          setRoomDate(e.target.value);
                          setRoomForm({ ...roomForm, book_date: e.target.value });
                        }}
                      />

                      <div className="space-y-4">
                        {ROOMS.map(room => {
                          const items = roomBookings
                            .filter(x => x.room_name === room)
                            .map(x => ({ ...x, start_time: normalizeHHMM(x.start_time), end_time: normalizeHHMM(x.end_time) }))
                            .sort((a,b) => (timeToMinutes(a.start_time) || 0) - (timeToMinutes(b.start_time) || 0));

                          const totalBooked = items.reduce((sum, item) => {
                            const start = timeToMinutes(item.start_time);
                            const end = timeToMinutes(item.end_time);
                            return sum + ((start != null && end != null && end > start) ? (end - start) : 0);
                          }, 0);

                          return (
                            <div key={room} className="border border-slate-200 rounded-xl p-4 bg-gradient-to-br from-white to-slate-50">
                              <div className="flex items-start justify-between gap-3 mb-2">
                                <div>
                                  <div className="font-semibold text-slate-800">{room}</div>
                                  <div className="text-xs text-slate-500 mt-1">
                                    {items.length === 0
                                      ? "Free all day"
                                      : `${items.length} booking${items.length > 1 ? "s" : ""} · ${formatMinutesAsDuration(totalBooked)} reserved`}
                                  </div>
                                </div>

                                <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${items.length === 0 ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700"}`}>
                                  {items.length === 0 ? "Available" : "Partly booked"}
                                </span>
                              </div>

                              {items.length === 0 ? (
                                <div className="mt-3 rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-4 text-sm text-emerald-700 font-medium">
                                  Available all day
                                </div>
                              ) : (
                                <>
                                  <RoomTimeline items={items} />

                                  <div className="space-y-2 mt-4">
                                    {items.map(b => (
                                      <div key={b.booking_id} className="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                                        <div className="flex items-start justify-between gap-3">
                                          <div className="min-w-0">
                                            <div className="flex items-center gap-2 flex-wrap">
                                              <span className="text-sm font-bold text-slate-800">{formatTimeLabel(b.start_time)} - {formatTimeLabel(b.end_time)}</span>
                                              <span className="text-[11px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 font-semibold">Booked</span>
                                            </div>
                                            <div className="text-xs text-slate-700 mt-2"><span className="font-semibold">Purpose:</span> {b.purpose}</div>
                                            <div className="text-xs text-slate-500 mt-1"><span className="font-semibold">Note:</span> {b.note || "-"}</div>
                                            <div className="text-xs text-slate-500 mt-1">by {b.requester_name}</div>
                                          </div>

                                          {b.requester_email === currentUser.email && (
                                            <button
                                              onClick={() => handleCancelRoom(b.booking_id)}
                                              className="text-red-600 hover:text-red-700 shrink-0"
                                              title="Cancel booking"
                                            >
                                              <Icons.XCircle size={18} />
                                            </button>
                                          )}
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                </>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </Card>

                    <Card className="p-5">
                      <h3 className="font-bold text-slate-800 mb-2">Book Meeting Room</h3>
                      <div className="text-xs text-slate-500 mb-4">Choose room, time, and purpose. The system will block overlapping bookings automatically.</div>

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Room</label>
                        <select
                          value={roomForm.room_name}
                          onChange={e => setRoomForm({ ...roomForm, room_name: e.target.value })}
                          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                          {ROOMS.map(room => <option key={room} value={room}>{room}</option>)}
                        </select>
                      </div>

                      <Input
                        label="Date"
                        type="date"
                        min={dateKey(new Date())}
                        value={roomForm.book_date}
                        onChange={e => setRoomForm({ ...roomForm, book_date: e.target.value })}
                      />

                      <div className="grid grid-cols-2 gap-3">
                        <Input
                          label="Start Time"
                          type="time"
                          value={roomForm.start_time}
                          onChange={e => setRoomForm({ ...roomForm, start_time: e.target.value })}
                        />
                        <Input
                          label="End Time"
                          type="time"
                          value={roomForm.end_time}
                          onChange={e => setRoomForm({ ...roomForm, end_time: e.target.value })}
                        />
                      </div>

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Purpose of Use <span className="text-red-500">*</span></label>
                        <input
                          value={roomForm.purpose}
                          onChange={e => setRoomForm({ ...roomForm, purpose: e.target.value })}
                          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="e.g. Staff meeting / Interview / Student consultation"
                        />
                      </div>

                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">Additional Note</label>
                        <textarea
                          value={roomForm.note}
                          onChange={e => setRoomForm({ ...roomForm, note: e.target.value })}
                          rows="3"
                          className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="Optional"
                        />
                      </div>

                      <Button onClick={handleBookRoom} disabled={loading}>{loading ? "Saving..." : "Book Room"}</Button>
                    </Card>
                  </>
                )}
              </main>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
